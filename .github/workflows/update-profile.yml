name: Update profile contribution cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "data/contributions.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update-cards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch contribution data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render profile cards
        run: python scripts/render_readme_cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          if git diff --cached --quiet; then
            echo "Contribution data and cards are already current."
          else
            git commit -m "Refresh profile contribution cards"
            git push
          fi
